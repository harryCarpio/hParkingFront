# Nginx que sirve el panel (SPA compilada) y hace de proxy hacia el backend.
#
# El upstream se resuelve en tiempo de ejecucion, no al arrancar:
#
#   * `resolver 127.0.0.11` es el DNS interno de Docker. Sin el, nginx resuelve
#     `hparking-app` una sola vez al iniciar y falla al arrancar si el backend
#     todavia no esta levantado.
#   * Al usar una variable en `proxy_pass`, nginx vuelve a resolver el nombre
#     cuando vence el TTL. Esto importa porque `deploy.sh` recrea el contenedor
#     del backend y su IP cambia: con un upstream resuelto estaticamente nginx
#     seguiria apuntando a la IP muerta hasta que se reinicie.
#
# El destino es el *nombre del contenedor* en la red `hparking_default`. Nunca
# `127.0.0.1` ni `host.docker.internal`: dentro de un contenedor ambos apuntan
# al propio contenedor, y el backend publica su puerto solo en el loopback del
# host (ver docs/gateway-502-504-filebeat-incident.md en hParkingServer).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream "http://hparking-app:8080";

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. El panel no se embebe en ningun sitio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API --------------------------------------------------------------
    # $request_uri se pasa tal cual (ya incluye /api/...), que es lo que espera
    # el backend: /api/auth/** y /api/v1/**.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Estaticos --------------------------------------------------------
    # config.js lo genera el entrypoint en cada arranque: nunca se cachea.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Vite pone un hash en cada asset, asi que son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fallback de SPA: react-router resuelve las rutas en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
