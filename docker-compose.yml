# Panel de administracion hParking.
#
#   docker compose up -d --build
#
# Notas de produccion:
#
#   * El servicio se une a `hparking_default`, la red del stack del backend, que
#     es la unica forma de que nginx alcance a `hparking-app`. La red se declara
#     `external` porque la crea el compose de hParkingServer: si no existe, este
#     compose falla en vez de crear una red vacia donde el nombre no resolveria.
#
#   * El puerto se publica solo en 127.0.0.1. Las reglas de iptables de Docker
#     se saltan ufw, asi que cualquier puerto en 0.0.0.0 queda expuesto a
#     Internet aunque el firewall parezca cerrado. Quien entra desde fuera es
#     nginx-proxy-manager, y lo hace por la red de Docker, no por el puerto
#     publicado — este queda solo para depurar con curl desde el host.
#
#   * container_name se mantiene como `hparking-nginx` porque es el destino que
#     tiene configurado nginx-proxy-manager para hparking-web.fixwireless.net.
#     Si se renombra, hay que actualizar ese proxy host o el sitio dara 502.
name: hparking-panel

services:
  panel:
    build:
      context: .
      args:
        # Identifica la compilacion en el pie del login.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    image: hparking-panel:latest
    container_name: hparking-nginx
    environment:
      # "/api" = mismo origen, nginx hace de proxy hacia hparking-app:8080.
      # Solo hay que cambiarlo si el panel debe apuntar a un backend externo.
      API_URL: ${PANEL_API_URL:-/api}
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - hparking_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hparking_default:
    external: true
